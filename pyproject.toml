[project]
name = "ilb"
version = "0.1.0"
description = "IREN 2x leverage vs underlying breakeven analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "yfinance>=0.2.40",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "scipy>=1.13",
    "ruptures>=1.1.9",        # PELT structural-break detection (CUSUM fallback if absent)
]

[project.optional-dependencies]
interactive = ["plotly>=5.22", "jinja2>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ilb = "ilb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["SIM300"]                # `actual == pytest.approx(expected)` is canonical
"src/ilb/data.py" = ["PLC0415"]          # local yfinance import is intentional
"src/ilb/btc_regime.py" = ["PLC0415"]    # local ruptures import enables CUSUM fallback

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
